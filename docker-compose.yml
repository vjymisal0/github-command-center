services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gcc
      POSTGRES_PASSWORD: gcc
      POSTGRES_DB: gcc
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres:
